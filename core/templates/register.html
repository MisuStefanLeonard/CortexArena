<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Înregistrare — Cortex Arena</title>
    <style>
        :root{
            --bg1: #0f1724;
            --accent: #ff8c00;
            --muted: #cbd5e1;
            --card: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.04);
            --error: #ef4444;
        }
        html,body{height:100%;margin:0;padding:0}
        body {
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            color: #fff;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            margin:0;
            padding:20px;
            box-sizing:border-box;
            -webkit-font-smoothing:antialiased;
        }
        .card{
            background:var(--card);
            backdrop-filter:blur(10px);
            padding:32px;
            border-radius:16px;
            box-shadow:0 8px 24px rgba(2,6,23,0.7);
            width:100%;
            max-width:420px;
        }
        .logo{
            width:56px;
            height:56px;
            border-radius:12px;
            background:linear-gradient(135deg,#fff6e6,#ffd6a5);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#222;
            font-weight:700;
            font-size:20px;
            margin:0 auto 16px auto;
        }
        h1{margin:0 0 8px 0;text-align:center;font-size:24px}
        .subtitle{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14px}
        .form-group{margin-bottom:18px}
        label{display:block;margin-bottom:6px;color:var(--muted);font-size:14px;font-weight:500}
        input[type=text],input[type=password],input[type=email]{
            width:100%;
            padding:12px 14px;
            border-radius:8px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.05);
            color:#fff;
            font-size:14px;
            box-sizing:border-box;
        }
        input:focus{
            outline:none;
            border-color:var(--accent);
            background:rgba(255,255,255,0.08);
        }
        .btn{
            width:100%;
            padding:14px;
            border-radius:8px;
            background:var(--accent);
            color:#111;
            font-weight:700;
            border:none;
            cursor:pointer;
            font-size:15px;
            margin-top:8px;
        }
        .btn:hover{background:#ffa31a}
        .error{
            background:rgba(239,68,68,0.15);
            border:1px solid rgba(239,68,68,0.3);
            color:#fca5a5;
            padding:10px 12px;
            border-radius:8px;
            margin-bottom:16px;
            font-size:14px;
        }
        .link{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
        .link a{color:var(--accent);text-decoration:none}
        .link a:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">CA</div>
        <h1>Creează-ți cont</h1>
        <p class="subtitle">Începe să-ți antrenezi mintea astăzi</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
            <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password1">Parolă</label>
                <input type="password" id="password1" name="password1" required>
            </div>
            <div class="form-group">
                <label for="password2">Confirmă parola</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <button type="submit" class="btn">Înregistrează-te</button>
        </form>

        <div class="link">
            Ai deja cont? <a href="{% url 'login' %}">Intră în cont</a>
        </div>
    </div>
</body>
</html>
