version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mindarena_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mindarena
      POSTGRES_USER: mindarena_user
      POSTGRES_PASSWORD: mindarena_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindarena_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: mindarena_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: 'True'
      SECRET_KEY: 'your-secret-key-here'
      DATABASE_URL: postgresql://mindarena_user:mindarena_password@db:5432/mindarena
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
