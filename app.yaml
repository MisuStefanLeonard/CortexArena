name: mind-arena
services:
- name: web
  github:
    branch: main
    repo: yourusername/mind-arena
  build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
  http_port: 8000
  run_command: gunicorn --workers 3 --bind 0.0.0.0:8000 arena.wsgi:application
  envs:
  - key: DEBUG
    value: "False"
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${APP_DOMAIN_SECRET_KEY}
  - key: ALLOWED_HOSTS
    value: ${APP_DOMAIN},${APP_DOMAIN_ALT}
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
  - key: ENVIRONMENT
    value: production
  health_check:
    http_path: /
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-s

databases:
- name: db
  engine: PG
  version: "15"
  production: true
